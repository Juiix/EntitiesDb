name: Build & Publish NuGet Packages

on:
  push:
    branches: [ main ]
    paths:
      - "src/EntitiesDb/**"
  workflow_dispatch: {}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets NuGet/login request a GitHub OIDC token to trade for a short-lived nuget.org API key.
      id-token: write
    env:
      DOTNET_NOLOGO: true
      # Prevent telemetry for CI builds
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: '8.x'

      - name: 📦 Restore dependencies
        run: |
          dotnet restore src/EntitiesDb.SourceGenerators/EntitiesDb.SourceGenerators.csproj
          dotnet restore src/EntitiesDb/EntitiesDb.csproj

      - name: 🏗️ Build (Release)
        run: |
          dotnet build src/EntitiesDb.SourceGenerators/EntitiesDb.SourceGenerators.csproj --configuration Release --no-restore
          dotnet build src/EntitiesDb/EntitiesDb.csproj --configuration Release --no-restore

      - name: 📦 Pack NuGet packages
        run: |
          dotnet pack src/EntitiesDb/EntitiesDb.csproj --configuration Release --no-build --output ./nupkgs

      - name: 🚚 Upload built packages as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: nupkgs
          path: ./nupkgs/*.nupkg

      # Trusted publishing: the temporary key is valid for 1 hour, so fetch it right before the push.
      - name: 🔑 NuGet login (OIDC → temporary API key)
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: 🚀 Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          dotnet nuget push "./nupkgs/*.nupkg" \
            --source "https://api.nuget.org/v3/index.json" \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate
